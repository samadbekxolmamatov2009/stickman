<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>O'q-yoy dueli — Stickman Games</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <a class="back-link" href="../../index.html">← Menyu</a>
    <canvas id="game" width="960" height="540"></canvas>

    <div id="hud" class="hidden">
      <div class="top-row">
        <div class="score-chip p1">P1 <b id="score1">0</b></div>
        <div id="wind-box">Shamol <span id="wind-arrow">→</span> <b id="wind-val">0</b></div>
        <div class="score-chip p2">P2 <b id="score2">0</b></div>
      </div>
      <div id="turn-label">P1 navbati</div>
      <div id="power-wrap"><div id="power-bar"></div></div>
    </div>

    <div id="start-screen" class="overlay">
      <h1>O'Q-YOY<span class="dot">.</span>DUELI</h1>
      <p class="tag">3 zarbagacha — navbat bilan</p>
      <div class="picker">
        <span class="picker-label">Raqib</span>
        <div class="seg" id="mode-seg">
          <button data-v="bot" class="active">Bot</button>
          <button data-v="human">2-o'yinchi</button>
        </div>
      </div>
      <p class="hint"><b>↑ / ↓</b> burchak · <b>SPACE</b>ni bosib turing (kuch) va qo'yib yuboring</p>
      <p class="hint mobile-only">Ekranni bosib turing (kuch), tepa/pastga sudrab burchak sozlang</p>
      <button id="start-btn">Duelni boshlash</button>
    </div>

    <div id="results-screen" class="overlay hidden">
      <h2 id="winner-text">G'olib!</h2>
      <button id="retry-btn">Yana o'ynash</button>
    </div>

    <div id="touch-aim" class="hidden"></div>
  </div>

  <script src="../../shared/common.js"></script>
  <script src="script.js"></script>
</body>
</html>
