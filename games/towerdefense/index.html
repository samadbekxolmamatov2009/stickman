<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>Minora mudofaasi — Stickman Games</title>
<link rel="stylesheet" href="../../shared/common.css">
</head>
<body>
  <div id="game-wrap">
    <a class="back-link" href="../../index.html">‹</a>
    <canvas id="game"></canvas>

    <div id="start-screen" class="overlay">
      <h1>MINORA<span class="dot">.</span>MUDOFAASI</h1>
      <p class="tag">10 to'lqin · 4 xil himoyachi · yangilash</p>
      <p class="hint">Bo'sh maydonchani bosib himoyachi tanlang: <b>Yoychi</b> (uzoqdan), <b>Sehrgar</b> (muzlatadi, guruhga), <b>Bombachi</b> (katta portlash), <b>Ninja</b> (yaqindan juda tez). Himoyachini bosib <b>kuchaytiring</b> yoki soting. Dushman darvozaga yetmasin!</p>
      <button id="start-btn">Boshlash</button>
      <button class="hidden"></button>
    </div>

    <div id="results-screen" class="overlay hidden">
      <h2 id="winner-text">Tamom!</h2>
      <p class="big-score" id="final-score"></p>
      <div class="btn-row">
        <button id="retry-btn">Yana o'ynash</button>
        <a class="secondary-link" href="../../index.html">Menyu</a>
      </div>
    </div>
  </div>

  <script src="../../shared/engine.js"></script>
  <script src="../../shared/char.js"></script>
  <script src="../../shared/scenery.js"></script>
  <script src="script.js"></script>
</body>
</html>
