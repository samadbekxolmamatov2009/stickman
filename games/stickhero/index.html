<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>Ko'prik qahramoni — Stickman Games</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <a class="back-link" href="../../index.html">← Menyu</a>
    <canvas id="game" width="960" height="540"></canvas>

    <div id="score" class="hidden">0</div>

    <div id="start-screen" class="overlay">
      <h1>KO'PRIK<span class="dot">.</span>QAHRAMONI</h1>
      <p class="tag">timing o'yini</p>
      <p class="hint">Ekranga / <b>SPACE</b> tugmasini bosib turing — ko'prik cho'ziladi, qo'yib yuboring!</p>
      <button id="start-btn">Boshlash</button>
      <p class="best-line">Eng yaxshi: <b id="best">0</b></p>
    </div>

    <div id="results-screen" class="overlay hidden">
      <h2>Yiqildingiz!</h2>
      <p id="final-score">Ball: 0</p>
      <button id="retry-btn">Yana urinish</button>
    </div>
  </div>

  <script src="../../shared/common.js"></script>
  <script src="script.js"></script>
</body>
</html>
