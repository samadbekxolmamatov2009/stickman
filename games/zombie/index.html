<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>Zombi himoyasi — Stickman Games</title>
<link rel="stylesheet" href="../../shared/common.css">
</head>
<body>
  <div id="game-wrap">
    <a class="back-link" href="../../index.html">‹</a>
    <canvas id="game"></canvas>

    <div id="start-screen" class="overlay">
      <h1>ZOMBI<span class="dot">.</span>HIMOYASI</h1>
      <p class="tag">to'lqinlar · qobiliyat tanlash · boss</p>
      <p class="hint">Qahramon eng yaqin zombiga <b>o'zi otadi</b> — siz faqat yuring va qoching (joystik yoki <b>WASD</b>, siltanish — 💨 yoki <b>SHIFT</b>). Har to'lqindan keyin <b>3 ta qobiliyatdan birini</b> tanlaysiz. Har 5-to'lqinda boss!</p>
      <button id="start-btn">Omon qolishni boshlash</button>
      <p class="best-line">Eng yaxshi natija: <b id="best">0</b></p><button class="hidden"></button>
    </div>

    <div id="results-screen" class="overlay hidden">
      <h2 id="winner-text">Tamom!</h2>
      <p class="big-score" id="final-score"></p>
      <div class="btn-row">
        <button id="retry-btn">Yana o'ynash</button>
        <a class="secondary-link" href="../../index.html">Menyu</a>
      </div>
    </div>
  </div>

  <script src="../../shared/engine.js"></script>
  <script src="../../shared/char.js"></script>
  <script src="../../shared/scenery.js"></script>
  <script src="script.js"></script>
</body>
</html>
