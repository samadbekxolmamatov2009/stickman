<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>Parkur minorasi — Stickman Games</title>
<link rel="stylesheet" href="../../shared/common.css">
</head>
<body>
  <div id="game-wrap">
    <a class="back-link" href="../../index.html">‹</a>
    <canvas id="game"></canvas>

    <div id="start-screen" class="overlay">
      <h1>PARKUR<span class="dot">.</span>MINORASI</h1>
      <p class="tag">tepaga chiq · lavadan qoch</p>
      <p class="hint">Qahramon o'zi sakraydi — siz ekranning <b>chap / o'ng</b> tomonini bosib (yoki <b>A/D</b>, <b>←/→</b>) boshqarasiz. 🟫 sinadigan, ↔ qimirlaydigan, 🟢 prujinali platformalar bor. 🚀 raketa tepaga uchiradi. Pastdan <b>lava</b> ko'tariladi!</p>
      <button id="start-btn">Chiqishni boshlash</button>
      <p class="best-line">Eng yaxshi natija: <b id="best">0</b></p><button class="hidden"></button>
    </div>

    <div id="results-screen" class="overlay hidden">
      <h2 id="winner-text">Tamom!</h2>
      <p class="big-score" id="final-score"></p>
      <div class="btn-row">
        <button id="retry-btn">Yana o'ynash</button>
        <a class="secondary-link" href="../../index.html">Menyu</a>
      </div>
    </div>
  </div>

  <script src="../../shared/engine.js"></script>
  <script src="../../shared/char.js"></script>
  <script src="../../shared/scenery.js"></script>
  <script src="script.js"></script>
</body>
</html>
