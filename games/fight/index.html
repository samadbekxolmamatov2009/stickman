<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>Arena Fight — Stickman Games</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <a class="back-link" href="../../index.html">← Menyu</a>
    <canvas id="game" width="960" height="540"></canvas>

    <div id="hud" class="hidden">
      <div class="bar-wrap p1"><div class="name">P1</div><div class="bar"><div id="hp1" class="fill"></div></div></div>
      <div id="rounds"></div>
      <div class="bar-wrap p2"><div class="name" id="p2name">BOT</div><div class="bar"><div id="hp2" class="fill"></div></div></div>
    </div>

    <div id="start-screen" class="overlay">
      <h1>ARENA<span class="dot">.</span>FIGHT</h1>
      <p class="tag">3 raundli musht-tepki duel</p>
      <div class="picker">
        <span class="picker-label">Raqib</span>
        <div class="seg" id="mode-seg">
          <button data-v="bot" class="active">Bot</button>
          <button data-v="human">2-o'yinchi</button>
        </div>
      </div>
      <p class="hint">P1: <b>A/D</b> yurish · <b>W</b> sakrash · <b>F</b> zarba</p>
      <p class="hint" id="p2-hint">P2: <b>←/→</b> yurish · <b>↑</b> sakrash · <b>L</b> zarba</p>
      <p class="hint mobile-only">Chapda yurish, o'ngda zarba tugmalari</p>
      <button id="start-btn">Jangni boshlash</button>
    </div>

    <div id="results-screen" class="overlay hidden">
      <h2 id="winner-text">G'olib!</h2>
      <button id="retry-btn">Yana o'ynash</button>
    </div>

    <div id="touch-controls" class="hidden">
      <div class="tc-left">
        <button id="tc-left" class="tc-btn">◀</button>
        <button id="tc-right" class="tc-btn">▶</button>
      </div>
      <div class="tc-right">
        <button id="tc-jump" class="tc-btn">⤊</button>
        <button id="tc-atk" class="tc-btn atk">👊</button>
      </div>
    </div>
  </div>

  <script src="../../shared/common.js"></script>
  <script src="script.js"></script>
</body>
</html>
