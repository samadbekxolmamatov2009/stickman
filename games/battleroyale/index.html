<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>Battle Royale — Stickman Games</title>
<link rel="stylesheet" href="../../shared/common.css">
</head>
<body>
  <div id="game-wrap">
    <a class="back-link" href="../../index.html">‹</a>
    <canvas id="game"></canvas>

    <div id="start-screen" class="overlay">
      <h1>BATTLE<span class="dot">.</span>ROYALE</h1>
      <p class="tag">oxirgi omon qolgan yutadi</p>
      <div class="picker-row"><div class="picker"><span class="picker-label">Raqiblar</span>
        <div class="seg" id="bots-seg"><button data-v="3">3</button><button data-v="5">5</button><button data-v="7" class="active">7</button></div></div>
        <div class="picker"><span class="picker-label">Qiyinlik</span>
        <div class="seg" id="diff-seg"><button data-v="0">Oson</button><button data-v="1" class="active">O'rta</button><button data-v="2">Qiyin</button></div></div></div>
      <p class="hint">Qutilardan <b>qurol</b> toping (qilich, kamon, shuriken), dori va zirh yig'ing. <b>Zona torayadi</b> — tashqarida qolmang! <span class="desktop-only" style="display:inline">Klaviatura: <b>WASD</b> yurish · <b>SPACE</b> zarba · <b>SHIFT</b> siltanish.</span></p>
      <button id="start-btn">Jangga kirish</button>
      <p class="best-line">Eng yaxshi natija: <b id="best">0</b></p><button class="hidden"></button>
    </div>

    <div id="results-screen" class="overlay hidden">
      <h2 id="winner-text">Tamom!</h2>
      <p class="big-score" id="final-score"></p>
      <div class="btn-row">
        <button id="retry-btn">Yana o'ynash</button>
        <a class="secondary-link" href="../../index.html">Menyu</a>
      </div>
    </div>
  </div>

  <script src="../../shared/engine.js"></script>
  <script src="../../shared/char.js"></script>
  <script src="../../shared/scenery.js"></script>
  <script src="script.js"></script>
</body>
</html>
