<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b0f1a}canvas{display:block}</style></head>
<body><div id="game-wrap"><canvas id="game"></canvas></div>
<script src="shared/engine.js"></script><script src="shared/char.js"></script><script src="shared/scenery.js"></script>
<script>
const v = SG.initView(document.getElementById('game'));
const themes = ['meadow','sunset','night','snow','forest','stadium'];
const th = new URLSearchParams(location.search).get('t') || 'meadow';
const sc = new SG.Scenery(th, 3);
const P = SG.poses;
const names = ['stand','guard','run','run2','walk','jump','fall','slide','duck','block','punch','cross','upper','kick','kickUp','hurt','ko','cheer','aim','slash','push','faceplant'];
const cols = ['#ff5d5d','#4da3ff','#4ddd8f','#c77dff','#ffb84d'];
const chars = names.map((n,i)=> new SG.Char({color: cols[i%5], style: i%5===3?'helmet': i%5===1?'spiky':'band'}));
let t=0;
SG.run(dt=>{t+=dt;}, ctx=>{
  const gy = 400;
  sc.draw(ctx, v.W, v.H, t*40, gy, t);
  names.forEach((n,i)=>{
    const c = chars[i];
    let pose;
    if(n==='run') pose=P.run(t*10); else if(n==='run2') pose=P.run(1.2); else if(n==='walk') pose=P.walk(t*7);
    else if(n==='aim') pose=P.aim(0.5,1); else if(n==='slash') pose=P.slash((Math.sin(t*4)+1)/2);
    else pose=P[n](t);
    c.to(pose, 0.016, 14);
    const row = i<11?0:1; const col = i<11?i:i-11;
    const x = 60 + col*((v.W-80)/11), y = row===0? gy-150 : gy;
    const wpn = n==='aim'?'bow': n==='slash'?'sword': n==='guard'?'club': n==='block'?'spear': n==='cross'?'hammer': n==='stand'?'staff':null;
    c.draw(ctx, x, y, {facing: i%7===6?-1:1, weapon: wpn, bowPull:1, arrow:true, mood: n==='ko'?'ko': n==='hurt'?'hurt': n==='cheer'?'happy':'normal', groundY: gy, scale: n==='walk'?0.6:1});
    SG.label(ctx, n, x, y+24, 11);
  });
});
</script></body></html>
