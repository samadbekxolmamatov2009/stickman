<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>Stickman Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="shared/common.css">
<style>
  html, body { overflow: hidden; }
  #bg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #hub { position: fixed; inset: 0; overflow-y: auto; padding: 14px 18px 24px; -webkit-overflow-scrolling: touch; }
  header { text-align: center; margin-bottom: 12px; }
  header h1 { font-size: clamp(28px, 8vh, 50px); font-weight: 900; letter-spacing: 2px; text-shadow: 0 4px 0 rgba(0,0,0,0.4), 0 0 34px rgba(55,214,196,0.35); }
  header h1 .dot { color: var(--accent); }
  header .tag { display: inline-block; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 12px; max-width: 1120px; margin: 0 auto; }
  .card { position: relative; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 18px; text-decoration: none; color: #fff;
    background: linear-gradient(150deg, rgba(20,26,46,0.86), rgba(12,16,30,0.78)); border: 1.5px solid rgba(255,255,255,0.14);
    box-shadow: 0 8px 22px rgba(0,0,0,0.35); backdrop-filter: blur(3px); transition: transform 0.1s ease; min-height: 86px; }
  .card:active { transform: scale(0.96); }
  .card .icon { flex: none; width: 58px; height: 58px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2), 0 4px 10px rgba(0,0,0,0.3); }
  .card h3 { font-size: 16px; font-weight: 900; margin-bottom: 3px; }
  .card p { font-size: 11.5px; opacity: 0.78; line-height: 1.3; }
  .card .players { display: inline-block; margin-top: 5px; font-size: 10px; font-weight: 800; color: #ffd34d; background: rgba(255,255,255,0.09); padding: 2px 8px; border-radius: 9px; }
  .card.soon { opacity: 0.5; filter: grayscale(0.5); }
  .soon-badge { position: absolute; top: 8px; right: 10px; font-size: 9px; font-weight: 900; letter-spacing: 0.5px; background: rgba(255,255,255,0.16); padding: 3px 8px; border-radius: 9px; text-transform: uppercase; }
  footer { text-align: center; opacity: 0.45; font-size: 11px; margin-top: 16px; }
</style>
</head>
<body>
  <div id="bg"><canvas id="game"></canvas></div>
  <div id="hub">
    <header>
      <h1>STICKMAN<span class="dot">.</span>GAMES</h1>
      <p class="tag">14 ta o'yin · bitta ilova</p>
    </header>
    <div class="grid" id="grid"></div>
    <footer>v1.0 · stickman games</footer>
  </div>
  <script src="shared/engine.js"></script>
  <script src="shared/char.js"></script>
  <script src="shared/scenery.js"></script>
  <script src="hub.js"></script>
</body>
</html>
